name = "pj-rust-cli"
version = "0.1.1"

# Rust CLI extras. Sits ABOVE pj-rust in the compose order, so its
# files override pj-rust's on conflict (pj-rust's CI matrix is the
# baseline; this layer can replace it with a publish-aware variant
# when release.yml lands).

[[file]]
src = ".editorconfig"
how = "overwrite"
when = "once"
