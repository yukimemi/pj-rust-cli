name = "pj-rust-cli"
version = "0.4.1"

# Rust CLI extras. Sits ABOVE pj-rust in the compose order, so its
# files override pj-rust's on conflict (pj-rust's CI matrix is the
# baseline; this layer can replace it with a publish-aware variant
# when release.yml lands).

[[file]]
src = ".editorconfig"
how = "overwrite"
when = "once"

# CLI-layer agent guidance — release.yml usage, BIN_NAME override
# notes, the `package.publish = false` opt-out for internal-only
# crates. Lives in its own marker block so pj-base's
# language-agnostic block and pj-rust's Rust-language block stay
# untouched in the same AGENTS.md.
[[file]]
src = "AGENTS.md.rust-cli"
dst = "AGENTS.md"
how = "merge-section"
when = "always"
marker = { begin = "<!-- kata:agents:rust-cli:begin -->", end = "<!-- kata:agents:rust-cli:end -->" }

# Tag-driven release pipeline (build matrix + GitHub Release +
# crates.io publish). `.template` suffix keeps GitHub Actions
# from auto-running the source inside this repo. `when = "always"`
# so upstream fixes (e.g. toolchain or runner pinning) propagate
# automatically via `kata apply` without manual per-repo edits.
[[file]]
src = ".github/workflows/release.yml.template"
dst = ".github/workflows/release.yml"
how = "overwrite"
when = "always"

# Release-time smoke target. The default `main` is a no-op so the
# template can drop into any consumer without breaking its existing
# release pipeline; each crate is expected to override this file
# with a real startup probe (HTTPS handshake, I/O check) so future
# regressions like shoka v0.10.0's rustls panic surface in CI
# before they reach published binaries. `.template` suffix avoids
# accidentally compiling this file inside the preset repo itself
# (which has no Cargo.toml). See examples/smoke.rs.template for the
# rationale and per-crate override guidance.
[[file]]
src = "examples/smoke.rs.template"
dst = "examples/smoke.rs"
how = "overwrite"
when = "once"

# Renovate: repoint the consumer's `extends` at THIS layer's own
# preset (`default.json`), which extends the layer below it and adds
# whatever rules this layer owns.
#
# Every layer ships this same entry naming ITSELF; kata's compose rule
# (last layer wins on file conflicts) then resolves `extends` to the
# topmost APPLIED layer automatically. No layer needs to know what
# sits above it, and no preset var is involved.
#
# `how = "merge-json"` with `paths = ["extends"]` rewrites ONLY the
# `extends` array, leaving any consumer-added keys (labels, extra
# packageRules, …) untouched — unlike a blanket overwrite. The same
# `renovate.json` doubles as this repo's OWN Renovate config.
[[file]]
src = "renovate.json"
how = "merge-json"
when = "always"
paths = ["extends"]
